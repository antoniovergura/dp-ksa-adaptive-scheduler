[tool.ruff]
target-version = "py310"
line-length = 100
# Frozen experimental artifacts preserve the code and formatting used at execution.
exclude = ["archive", "reports", "models", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
